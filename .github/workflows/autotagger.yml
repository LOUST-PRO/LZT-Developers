name: "Auto-Tagger & Assigner"

on:
  pull_request:
    types: [opened, reopened, closed]
    paths:
      - 'members/**'

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - name: Process Member PR
        uses: actions/github-script@v7
        with:
          script: |
            const action = context.payload.action;
            const pr = context.payload.pull_request;
            const author = pr.user.login;

            if (action === 'opened' || action === 'reopened') {
              // Add triage labels
              await github.rest.issues.addLabels({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                labels: ['new-member', 'needs-review']
              });

              // Assign to louzt
              await github.rest.issues.addAssignees({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                assignees: ['louzt']
              });

              // Welcome Comment in English
              const welcomeBody = [
                `**Welcome to the LZT-Developers Directory, @${author}!**`,
                '',
                'Thank you for submitting your member profile. Our automation has assigned @louzt to verify the YAML schema format.',
                '',
                'Once merged, your developer card will be published live at **[devs-github.loust.pro](https://devs-github.loust.pro)**.',
                '',
                '### Open-Source Ecosystem',
                'While your profile is being reviewed, explore our core open-source projects:',
                '- **[SnapPipe](https://github.com/LOUST-PRO/SnapPipe)** — Identity-based QUIC transport toolkit and self-hosted relay scaffolding (Rust)',
                '- **[LinkMarks](https://github.com/LOUST-PRO/LinkMarks)** — Local-first, single-binary bookmark manager with TUI and SQLite (Rust)',
                '- **[PaperForge](https://github.com/LOUST-PRO/paperforge)** — Linux workspace and frontend for Wallpaper Engine scenes (Rust)',
                '- **[TaxonRouter](https://github.com/LOUST-PRO/TaxonRouter)** — GitHub Projects (v2) board automation daemon and MCP server (Go)',
                '- **[storage-mountguardian](https://github.com/LOUST-PRO/storage-mountguardian)** — Linux daemon preventing kernel D-state freezes on failing storage (Rust)',
                '- **[NetBoozt](https://github.com/LOUST-PRO/NetBoozt_InternetUpgrade)** — Cross-platform TCP optimization and latency diagnostics (Rust/Tauri)',
                '- **[lzt-virtuoso-tools](https://github.com/LOUST-PRO/lzt-virtuoso-tools)** — RDF dataset ingestion pipeline and SPARQL tooling (Python)',
                '',
                '*If you find these systems useful, consider starring the repositories on GitHub.*'
              ].join('\n');

              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: welcomeBody
              });
            } else if (action === 'closed' && pr.merged) {
              // Add merged celebration comment
              const celebrationBody = [
                `**Congratulations @${author}! Your profile is now live.**`,
                '',
                `Your developer card has been incorporated into the directory and is available at:`,
                `**[devs-github.loust.pro](https://devs-github.loust.pro)**`,
                '',
                'Thank you for contributing to the directory.',
                '',
                '**Support our open-source tools:**',
                'If you find our tooling valuable, consider leaving a star on our core repositories:',
                '- [SnapPipe](https://github.com/LOUST-PRO/SnapPipe)',
                '- [LinkMarks](https://github.com/LOUST-PRO/LinkMarks)',
                '- [PaperForge](https://github.com/LOUST-PRO/paperforge)',
                '- [TaxonRouter](https://github.com/LOUST-PRO/TaxonRouter)',
                '- [storage-mountguardian](https://github.com/LOUST-PRO/storage-mountguardian)'
              ].join('\n');

              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: celebrationBody
              });
            }
