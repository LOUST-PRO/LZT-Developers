name: Deploy LZT-Developers

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to VPS Path
        run: |
          cd /home/cms_projects/lzt-developers
          git pull origin main
          npm ci
          npm run build
          pm2 restart lzt-developers
